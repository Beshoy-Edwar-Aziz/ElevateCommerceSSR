<section class="mt-20">
  <label for="search" class="block mb-2.5 text-sm font-medium text-heading sr-only">{{
    'product.search' | translate
  }}</label>
  <div class="relative max-w-md mx-auto">
    <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
      <svg
        class="w-4 h-4 text-body"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-width="2"
          d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
        />
      </svg>
    </div>
    <input
      type="search"
      id="search"
      class="block w-full p-3 ps-9 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
      placeholder="{{ 'product.search' | translate }}"
      [(ngModel)]="inputValue"
    />
  </div>
  <h1 class="text-main font-extrabold text-4xl mb-3">{{ 'product.title' | translate }}</h1>
  <div class="grid sm:grid-cols-2 md:grid-cols-4 gap-4">
    @for (product of products() | search: inputValue; track product?._id) {
      @defer (hydrate on idle) {
        <product-card
          [product]="product"
          [wishList]="wishListProds()"
          (productId)="addProductToCart($event)"
          (productIdForWishList)="addProductToWishList($event)"
        ></product-card>
      } @placeholder(minimum 500ms) {
        <div>
          <div
            role="status"
            class="flex items-center justify-center h-56 max-w-sm bg-neutral-quaternary rounded-base animate-pulse"
          >
            <i class="fa-solid fa-image text-3xl"></i>
            <span class="sr-only">Loading...</span>
          </div>

          <div role="status" class="mt-5 max-w-sm animate-pulse">
            <div class="h-2.5 bg-neutral-quaternary rounded-full w-48 mb-4"></div>
            <div class="h-2 bg-neutral-quaternary rounded-full max-w-[360px] mb-2.5"></div>
            <div class="h-2 bg-neutral-quaternary rounded-full mb-2.5"></div>
            <div class="h-2 bg-neutral-quaternary rounded-full max-w-[330px] mb-2.5"></div>
            <div class="h-2 bg-neutral-quaternary rounded-full max-w-[300px] mb-2.5"></div>
            <div class="h-2 bg-neutral-quaternary rounded-full max-w-[360px]"></div>
            <span class="sr-only">Loading...</span>
          </div>
        </div>
      }
    }@empty {
      <h2 class="no-prods font-libre text-3xl font-bold text-main text-center">No Products Found</h2>
    }
  </div>
</section>
