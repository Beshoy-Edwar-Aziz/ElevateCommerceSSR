<div class="grid grid-cols-12 gap-2">
  <div class="col-span-12 md:col-span-3 rounded">
    <img [src]="wishList.imageCover" class="w-full" [alt]="wishList.title" />
  </div>
  <div class="col-span-12 md:col-span-9 relative flex flex-col text-main font-DM">
    <p class="font-semibold w-80 text-lg md:w-full md:text-sm">{{ wishList.title }}</p>
    <span class="font-medium">{{ wishList.price | currency: 'EGP' }}</span>
    <button
      class="add-btn border py-1 w-full md:w-1/2 rounded border-main hover:bg-main hover:text-white cursor-pointer"
      (click)="sendProductId()"
    >
      {{'product.add'|translate}}
    </button>
    <button
      class="delete-btn absolute rtl:left-0 ltr:right-0 top-0 md:top-20 border rounded-full w-7 h-7 grid justify-center items-center hover:bg-main hover:text-white cursor-pointer"
      (click)="deleteProductId()"
    >
      <i class="fa-solid fa-trash"></i>
    </button>
  </div>
</div>
